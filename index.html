<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letter Lab — Jeu de lettres</title><link rel="stylesheet" href="style.css"></head><body><main><header><span>JEU DE LOGIQUE · JAVASCRIPT</span><h1>Letter Lab<span class="dot">.</span></h1><p>Cinq lettres. Six essais. À toi de trouver.</p></header><div id="grid" aria-label="Historique des propositions"></div><p id="message" role="status" aria-live="polite">La partie commence.</p><form id="guess-form"><label for="guess">Ton mot de cinq lettres</label><div class="row"><input id="guess" autocomplete="off" autocapitalize="characters" maxlength="16" required aria-describedby="rules"><button id="submit">Valider</button></div></form><p id="rules">✓ Bien placée · ↔ Présente ailleurs · × Absente<br>Les accents sont retirés. Toutes les propositions de cinq lettres sont acceptées.</p><button id="restart" class="secondary" type="button">Nouvelle partie</button><footer>Un exercice de logique, créé avec assistance IA.</footer></main><script type="module" src="app.mjs"></script></body></html>
